<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Can't Stop – Chord Chart</title>
<style>
:root { --bg:#e9efe6; --ink:#16241a; --muted:#566a5b; --edge:#c4d1c1; }
@media (prefers-color-scheme: dark) { :root { --bg:#101a13; --ink:#e6efe3; --muted:#93a79a; --edge:#2a3b2f; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:"Trebuchet MS","Segoe UI",Helvetica,Arial,sans-serif; line-height:1.5; }
main { max-width:1040px; margin:0 auto; padding:24px 16px 48px; }
h1 { margin:0; font-size:clamp(1.8rem,5vw,2.6rem); letter-spacing:-0.01em; }
.sub { margin:2px 0 18px; color:var(--muted); }
.songform { padding:16px; border:1px solid var(--edge); border-radius:4px; background:#fff; }
.songform img { display:block; width:100%; height:auto; }
.note { color:var(--muted); font-size:.85rem; margin:14px 4px 0; }
</style>
</head>
<body>
<main>
  <h1>Can't Stop</h1>
  <p class="sub">Red Hot Chili Peppers · Anthony Kiedis, Flea, John Frusciante, Chad Smith</p>
  <section class="songform" id="chord-chart">
    <img src="./cant-stop-chords.png" alt="Chord chart for Can't Stop: intro and verse 1 with chord symbols over the lyrics">
  </section>
  <p class="note">Chord chart as written (guitar chord songbook, p. 24).</p>
</main>
</body>
</html>
